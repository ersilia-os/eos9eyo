Title: Antimicrobial activity prediction against Helicobacter pylori from public ChEMBL data
Description: Estimates activity against Helicobacter pylori, the gastric coloniser
  behind most peptic ulcers and a recognised cause of gastric cancer, where eradication
  regimens increasingly fail through clarithromycin resistance. Only one dose-response
  assay pool from ChEMBL held enough data to support a classifier, so this prediction
  has no ensemble behind it. The organism's requirement for acidic conditions also
  means standard broth screening translates imperfectly to the gastric niche.
